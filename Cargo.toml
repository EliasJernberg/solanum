[package]
name = "solanum"
version = "6.0.0"
edition = "2021"

[dependencies]
regex = "1.11"
glib-macros = "0.19"
gstreamer = "0.23"
gstreamer-play = "0.23"
libadwaita = { version = "0.7", features = ["v1_5"] }
# The rain background: raindrop-fx ported to OpenGL in a GtkGLArea, with
# the GL entry points looked up through libepoxy.
glow = "0.18"
libc = "0.2"

[dependencies.gtk]
version = "0.9"
package ="gtk4"
features = ["v4_12"]

[dependencies.gettext-rs]
version = "0.7.0"
features = ["gettext-system"]
